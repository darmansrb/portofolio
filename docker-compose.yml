services:
  portfolio:
    container_name: devportfolio
    restart: unless-stopped

    build:
      context: .
      dockerfile: Dockerfile
    image: devportfolio:prod

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.portfolio.rule=Host(`dthrees.my.id`)"
      - "traefik.http.routers.portfolio.entrypoints=web"
      - "traefik.http.services.portfolio.loadbalancer.server.port=80"

    networks:
      - proxy

networks:
  proxy:
    external: true
