server {
  listen       80;
  listen       [::]:80;
  server_name  _;

  root /usr/share/nginx/html;
  index index.html;

  # Cache hashed assets aggressively, fall back to index.html for SPA routes.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Lightweight gzip
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 256;
  gzip_proxied any;
  gzip_vary on;
  gzip_types
    text/plain
    text/css
    text/xml
    application/javascript
    application/json
    application/xml
    image/svg+xml;
}
