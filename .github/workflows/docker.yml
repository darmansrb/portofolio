name: build

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.commandcode/**'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Optional reason (logged in the deploy step)'
        required: false
        default: 'manual deploy'

# Allow only one concurrent deploy, queue others.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---- 1. always lint + typecheck + build on every push ----
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci
      - run: npm run check
      - run: npm run build
        env:
          VITE_SITE_URL: https://dthrees.my.id

  # ---- 2. Deploy to the VPS: SSH in, pull the latest source, build the
  #         image on the VPS via compose, and restart the stack.
  #         Runs on every push to main and via manual dispatch. Skips on PRs. ----
  deploy:
    name: deploy
    needs: ci
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: "Pre-flight - confirm all VPS secrets are set"
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
        run: |
          for v in VPS_HOST VPS_USER VPS_SSH_KEY VPS_APP_DIR; do
            if [ -z "${!v}" ]; then
              echo "::error::Secret $v is empty. Set it under Settings -> Secrets -> Actions."
              exit 1
            fi
          done
          echo "VPS_HOST=$VPS_HOST"
          echo "VPS_USER=$VPS_USER"
          echo "VPS_APP_DIR=$VPS_APP_DIR"
          echo "VPS_SSH_KEY length: ${#VPS_SSH_KEY}"

      - name: "Deploy via SSH"
        env:
          REASON: ${{ github.event.inputs.reason || format('push {0}', github.sha) }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 20m
          debug: true
          request_pty: true
          script: |
            set -euxo pipefail
            echo "==== deploy reason: $REASON ===="
            echo "==== [1/6] env ===="
            echo "whoami=$(whoami)  pwd=$(pwd)  date=$(date -u +%FT%TZ)"
            uname -a

            echo "==== [2/6] source dir ===="
            APP_DIR="${{ secrets.VPS_APP_DIR }}"
            cd "$APP_DIR"
            echo "APP_DIR=$APP_DIR"
            ls -la | head

            echo "==== [3/6] docker version ===="
            docker --version
            docker compose version

            echo "==== [4/6] git pull ===="
            git fetch origin main
            git reset --hard origin/main
            git log -1 --oneline

            echo "==== [5/6] docker compose build ===="
            docker compose build

            echo "==== [6/6] docker compose up + status ===="
            docker compose up -d --remove-orphans
            sleep 3
            docker compose ps
            docker compose logs --no-color --tail=80 devportfolio 2>&1 || true
            docker image prune -f
