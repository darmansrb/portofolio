name: build

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.commandcode/**'
  pull_request:
    branches: [main]

# Allow only one concurrent deploy, queue others.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---- 1. always lint + typecheck + build on every push/PR ----
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci
      - run: npm run check
      - run: npm run build
        env:
          # Tell Vite the canonical site URL so it can bake into meta tags.
          VITE_SITE_URL: https://dthrees.my.id

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  # ---- 2. build & push Docker image only on push to main, OR when the
  #         commit message / PR title contains the keyword "build" (case
  #         insensitive) ----
  docker:
    name: docker
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should-push: ${{ steps.gate.outputs.should-push }}
    steps:
      - id: gate
        run: |
          msg="${{ github.event.head_commit.message }}"
          echo "Commit message: $msg"
          if echo "$msg" | grep -qiE '\bbuild\b'; then
            echo "should-push=true" >> "$GITHUB_OUTPUT"
          else
            echo "should-push=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.gate.outputs.should-push == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        if: steps.gate.outputs.should-push == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/devportfolio
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=prod,enable={{is_default_branch}}
            type=raw,value={{date 'YYYYMMDD-HHmmss'}}
            type=sha,format=short

      - name: Build and push
        if: steps.gate.outputs.should-push == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---- 3. (optional) notify ----
  notify:
    name: notify
    needs: [ci, docker]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Print result
        run: |
          echo "ci=${{ needs.ci.result }}  docker=${{ needs.docker.result }}"
          if [ "${{ needs.docker.result }}" = "success" ]; then
            echo "✅ image built and pushed to Docker Hub"
          elif [ "${{ steps.gate.outputs.should-push }}" = "true" ]; then
            echo "❌ docker build/push failed"
            exit 1
          else
            echo "ℹ️  skipped docker build (no 'build' keyword in commit message)"
          fi
